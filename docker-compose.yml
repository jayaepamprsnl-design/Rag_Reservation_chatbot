###############################################################################
# CityPark RAG Chatbot — Stage 3 docker-compose
#
# Default services (always started):
#   api         FastAPI backend on :8000
#   ui          Combined Streamlit app (Chat + Admin Panel) on :8501
#   mcp-server  MCP server that appends approved reservations to a text file.
#               NOT published to the host: it sits on an internal-only network
#               (mcp_net) that only the api container also joins.
#
# MCP_API_KEY is required (no default on purpose).  Put it in .env:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Optional profile — enables the Mailpit SMTP capture service:
#   docker compose --profile mailpit up
###############################################################################

services:

  # ── MCP reservations server (Stage 3) ───────────────────────────────────────
  # Bound to 0.0.0.0 INSIDE the container only so the api container can reach it
  # over mcp_net; that network is `internal: true` and the service has no `ports`.
  # Container-specific values are fixed here (not interpolated from .env) so the
  # host-oriented values in .env.example (127.0.0.1, relative paths) can't break it.
  mcp-server:
    build:
      context: .
      target: runtime
    image: parking-rag-api:latest
    entrypoint: ["python", "scripts/run_mcp_server.py"]
    environment:
      MCP_API_KEY: ${MCP_API_KEY:?Set MCP_API_KEY in .env (see .env.example)}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      RESERVATIONS_FILE: /data/output/confirmed_reservations.txt
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - mcp_output:/data/output
    networks:
      - mcp_net
    expose:
      - "8765"
    # Least privilege: the server only needs to write /data/output.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── API backend ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    image: parking-rag-api:latest
    env_file: .env
    environment:
      CHROMA_PERSIST_DIR: /data/chroma_db
      CHROMA_COLLECTION: parking_static
      DATABASE_URL: sqlite:////data/parking.db
      ADMIN_API_BASE_URL: http://localhost:8000
      ANONYMIZED_TELEMETRY: "false"
      # Stage 3: reach the MCP server over the internal network. These override
      # the host-oriented MCP_* values that env_file may carry from .env.
      MCP_SERVER_URL: http://mcp-server:8765/mcp
      MCP_API_KEY: ${MCP_API_KEY:?Set MCP_API_KEY in .env (see .env.example)}
    volumes:
      - parking_data:/data
    networks:
      - default
      - mcp_net
    # No depends_on on purpose: an MCP outage must never stop approvals (the
    # reservation stays CONFIRMED and the retry worker catches up).
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Combined Streamlit UI (Chat + Admin Panel on one port) ───────────────────
  # The Admin Panel tab requires an ADMIN_API_KEY entered at login.
  ui:
    build:
      context: .
      target: runtime
    image: parking-rag-api:latest
    command:
      - streamlit
      - run
      - app/ui/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    env_file: .env
    environment:
      API_URL: http://api:8000
      # ADMIN_API_KEY is entered manually at the Admin Panel login.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-before-production}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Mailpit — local SMTP capture (optional profile) ──────────────────────────
  # docker compose --profile mailpit up
  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  # internal: true => no route to/from the host or the internet; only containers
  # attached to it (mcp-server, api) can talk to each other on it.
  mcp_net:
    internal: true

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  parking_data:
    driver: local
  # data/output of the MCP server: confirmed_reservations.txt + its .ids/.lock files
  mcp_output:
    driver: local
