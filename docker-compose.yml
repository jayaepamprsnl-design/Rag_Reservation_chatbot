###############################################################################
# CityPark RAG Chatbot — Stage 2 docker-compose
#
# Default services (always started):
#   api   FastAPI backend on :8000
#   ui    Combined Streamlit app (Chat + Admin Panel) on :8501
#
# Optional profile — enables the Mailpit SMTP capture service:
#   docker compose --profile mailpit up
###############################################################################

services:

  # ── API backend ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    image: parking-rag-api:latest
    env_file: .env
    environment:
      CHROMA_PERSIST_DIR: /data/chroma_db
      CHROMA_COLLECTION: parking_static
      DATABASE_URL: sqlite:////data/parking.db
      ADMIN_API_BASE_URL: http://localhost:8000
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - parking_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Combined Streamlit UI (Chat + Admin Panel on one port) ───────────────────
  # The Admin Panel tab requires an ADMIN_API_KEY entered at login.
  ui:
    build:
      context: .
      target: runtime
    image: parking-rag-api:latest
    command:
      - streamlit
      - run
      - app/ui/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    env_file: .env
    environment:
      API_URL: http://api:8000
      # ADMIN_API_KEY is entered manually at the Admin Panel login.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-before-production}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Mailpit — local SMTP capture (optional profile) ──────────────────────────
  # docker compose --profile mailpit up
  mailpit:
    profiles: [mailpit]
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

# ── Named volume ─────────────────────────────────────────────────────────────
volumes:
  parking_data:
    driver: local
