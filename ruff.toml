# Lint config used by CI (`ruff check app/ tests/ --ignore E501,E402`).
#
# The legacy Stage 1-2 test files predate the lint job and use compact idioms
# (semicolon-separated setup lines, unused imports kept for readability).
# They are exempted for these style-only rules rather than being rewritten, so
# the existing tests stay byte-for-byte untouched.  Everything under app/ and
# all new files are linted with no exemptions beyond E501/E402 (set in CI).
[lint.per-file-ignores]
"tests/*" = ["F401", "F841", "F541", "E702", "E741"]
