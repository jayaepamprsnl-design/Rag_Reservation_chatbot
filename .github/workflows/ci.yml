name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.10

      # Picks up ruff.toml (legacy test files are exempted from style-only rules).
      - name: Lint app/, tests/ and the Stage-3 scripts
        run: |
          ruff check app/ tests/ \
            scripts/run_mcp_server.py scripts/retry_pending_writes.py \
            --ignore E501,E402

  # ── Tests & Coverage ─────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Stage-2 variables required by admin-route and channel tests.
      # Tests that need specific values patch settings directly in fixtures;
      # these ensure pydantic-settings validation passes for all others.
      ADMIN_API_KEY: ci-test-admin-key
      ADMIN_API_BASE_URL: http://localhost:8000
      ADMIN_EMAIL_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      ADMIN_EMAIL: admin@citypark.example.com
      EMAIL_FROM: no-reply@citypark.example.com
      EMAIL_TOKEN_SECRET: ci-test-token-secret
      EMAIL_TOKEN_MAX_AGE_SECONDS: "86400"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.4.10

      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Seed database (offline / mock mode)
        run: python scripts/seed_db.py

      - name: Apply Stage-2 schema migration
        run: python scripts/migrate_stage2.py

      - name: Ingest static documents (offline / mock mode)
        run: CHROMA_COLLECTION=parking_static python scripts/ingest.py

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Docker build & smoke-test ─────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      # docker-compose.yml refuses to start without MCP_API_KEY (no default on
      # purpose). Generate a throw-away one for this run; it is never stored.
      - name: Generate a one-off MCP_API_KEY
        run: |
          KEY=$(openssl rand -hex 24)
          echo "::add-mask::$KEY"
          echo "MCP_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true puts the image into the local Docker daemon so the smoke tests
      # below (docker run / docker compose --no-build) can use it.
      - name: Build image (runtime stage only)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: |
            parking-rag-api:ci
            parking-rag-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Smoke-test — MCP server (internal only, auth enforced)
        run: |
          docker compose up -d --no-build mcp-server

          echo "Waiting for mcp-server to become healthy…"
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q mcp-server)")" = "healthy" ] && break
            echo "  attempt $i/20 — not healthy yet"
            sleep 3
          done

          CID=$(docker compose ps -q mcp-server)
          echo "--- /health (no token needed) ---"
          docker compose exec -T mcp-server curl -sf http://localhost:8765/health

          echo; echo "--- /mcp without token -> 401 ---"
          STATUS=$(docker compose exec -T mcp-server curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8765/mcp -H "Content-Type: application/json" -d '{}')
          [ "$STATUS" = "401" ] || (echo "Expected 401, got $STATUS"; docker compose logs mcp-server; exit 1)

          echo "--- /mcp with wrong token -> 401 ---"
          STATUS=$(docker compose exec -T mcp-server curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8765/mcp -H "Authorization: Bearer wrong" \
            -H "Content-Type: application/json" -d '{}')
          [ "$STATUS" = "401" ] || (echo "Expected 401, got $STATUS"; exit 1)

          echo "--- not published to the host ---"
          PORTS=$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$CID")
          echo "ports: $PORTS"
          echo "$PORTS" | grep -q HostPort && (echo "mcp-server must not publish ports"; exit 1)

          echo "--- attached only to the internal network ---"
          NETS=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$CID")
          echo "networks: $NETS"
          [ "$(echo $NETS | wc -w)" = "1" ] || (echo "expected exactly one network"; exit 1)

          docker compose down -v

      - name: Smoke-test — API health + admin endpoint
        run: |
          # Start the API with a minimal environment (no real API key needed
          # because the LLM falls back to MockLLMClient automatically).
          docker run --rm -d --name ci-api \
            -e CHROMA_COLLECTION=parking_static \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            -e CHROMA_PERSIST_DIR=/tmp/chroma \
            -e ADMIN_API_KEY=ci-smoke-key \
            -e ADMIN_EMAIL_ENABLED=false \
            -e EMAIL_TOKEN_SECRET=ci-smoke-secret \
            -p 8000:8000 \
            --entrypoint uvicorn \
            parking-rag-api:ci \
            app.api.main:app --host 0.0.0.0 --port 8000

          echo "Waiting for API to become healthy…"
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break
            echo "  attempt $i/15 — not ready yet"
            sleep 3
          done

          echo "--- Health check ---"
          curl -f http://localhost:8000/health

          echo "--- Admin auth (no key → 401) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/admin/reservations/pending)
          [ "$STATUS" = "401" ] || (echo "Expected 401, got $STATUS"; docker logs ci-api; exit 1)

          echo "--- Admin auth (valid key → 200) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Admin-Key: ci-smoke-key" \
            http://localhost:8000/admin/reservations/pending)
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS"; docker logs ci-api; exit 1)

          echo "--- Admin auth (wrong key → 403) ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Admin-Key: wrong-key" \
            http://localhost:8000/admin/reservations/pending)
          [ "$STATUS" = "403" ] || (echo "Expected 403, got $STATUS"; docker logs ci-api; exit 1)

          echo "All smoke tests passed."
          docker stop ci-api
