name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.10

      - name: Run ruff
        run: ruff check app/ tests/ --ignore E501,E402

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.4.10

      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      - name: Copy .env.example → .env
        run: cp .env.example .env

      - name: Seed database + ingest docs (offline/mock mode)
        run: |
          python scripts/seed_db.py
          CHROMA_COLLECTION=parking_static python scripts/ingest.py

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env.example → .env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (runtime stage only)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          tags: parking-rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          # Start the API container with a minimal env
          docker run --rm -d --name ci-api \
            -e CHROMA_COLLECTION=parking_static \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            -e CHROMA_PERSIST_DIR=/tmp/chroma \
            -p 8000:8000 \
            --entrypoint uvicorn \
            parking-rag-api:ci \
            app.api.main:app --host 0.0.0.0 --port 8000
          sleep 5
          curl -f http://localhost:8000/health || (docker logs ci-api && exit 1)
          docker stop ci-api
